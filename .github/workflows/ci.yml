name: Integración Continua - Uni2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: $ {{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: Uni2PruebasTest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Uni2PruebasTest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:$ {{ secrets.TEST_DB_PASSWORD }}@localhost:5432/Uni2PruebasTest
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Run integration tests
        run: npm run test:integration
