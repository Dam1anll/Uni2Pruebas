name: Integración Continua - Uni2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: Uni2PruebasTest
        # no es necesario exponer puertos en Actions; se puede omitir 'ports'
        options: >-
          --health-cmd "pg_isready -U postgres -d Uni2PruebasTest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # usar 127.0.0.1 para evitar resolución IPv6 a ::1
      TEST_DATABASE_URL: postgresql://postgres: ${{ secrets.TEST_DB_PASSWORD }}@127.0.0.1:5432/Uni2PruebasTest
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d Uni2PruebasTest && break
            echo "Esperando a PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run migrate

      - name: Run integration tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run test:integration

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: ./logs || ./test-results || ./coverage || .  # ajusta según tu estructura
